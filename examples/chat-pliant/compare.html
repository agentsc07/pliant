<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groupy — classic vs Pliant</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #e5e7eb; height: 100vh; display: flex; flex-direction: column; }
      header { padding: .7rem 1.2rem; display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
      header h1 { margin: 0; font-size: 1.1rem; }
      header span { color: #94a3b8; font-size: .9rem; }
      .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; padding: 0 .8rem .8rem; min-height: 0; }
      .pane { display: flex; flex-direction: column; min-height: 0; }
      .pane h2 { margin: 0 0 .4rem; font-size: .9rem; font-weight: 600; display: flex; gap: .5rem; align-items: center; }
      .tag { font-size: .7rem; background: #1e293b; border-radius: 99px; padding: .1rem .6rem; color: #94a3b8; font-weight: 400; }
      iframe { flex: 1; width: 100%; border: 1px solid #334155; border-radius: 10px; background: #fff; min-height: 0; }
      @media (max-width: 900px) { .panes { grid-template-columns: 1fr; grid-auto-rows: 1fr; } }
          nav a { color: #93c5fd; font-size: .85rem; } .demo { margin-left: auto; font-size: .75rem; color: #fbbf24; }
    </style>
  </head>
  <body>
    <header>
      <h1>Groupy: the same app, two ways</h1>
      <span id="blurb">Left: fixed UI. Right: press ✨ Customize and ask for what you want.</span>
      <nav><a href="?view=classic">Classic vs Pliant</a> · <a href="?view=users">Three users, three UIs</a></nav>
      <span class="demo">Demo: resets on restart; first load can take ~50 s.</span>
    </header>
    <div class="panes" id="panes"></div>
    <script>
      const q = new URLSearchParams(location.search);
      const view = q.get("view") || "classic";
      const dev = location.port === "5174";           // vite dev servers; otherwise everything is on one origin
      const pliantUrl = (u) => (dev ? `http://${location.hostname}:5174/` : "/") + `?user=${u}`;
      const classicUrl = (u) => (dev ? `http://${location.hostname}:5173/` : "/classic/") + `?user=${u}`;
      const panes = view === "users"
        ? [["Sai (u1)", "u1"], ["Maya (u2)", "u2"], ["Ravi (u3)", "u3"]].map(([t, u]) => [t, "Pliant · own profile", pliantUrl(u)])
        : [["Classic", "plain React", classicUrl(q.get("user") || "u1")], ["Pliant", "same components, wrapped", pliantUrl(q.get("user") || "u1")]];
      if (view === "users") {
        document.getElementById("blurb").textContent = "Same app, same backend: each user customises their own copy. Try a different request in each.";
        document.getElementById("panes").style.gridTemplateColumns = "1fr 1fr 1fr";
      }
      document.getElementById("panes").innerHTML = panes.map(([t, tag, src]) =>
        `<section class="pane"><h2>${t} <span class="tag">${tag}</span></h2><iframe title="${t}" src="${src}"></iframe></section>`).join("");
    </script>
  </body>
</html>
